<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>四象限时间管理 · 可拖动任务</title>
<link rel="stylesheet" href="styles/core.css?v=20261004-5" />
<link rel="stylesheet" href="styles/plugin-theme.css?v=20261004-5" />
<link rel="stylesheet" href="styles/plugin-store.css?v=20261004-5" />
<link rel="stylesheet" href="styles/ui-2.css?v=20261004-5" />
<link rel="stylesheet" href="styles/ui-2-panels.css?v=20261004-5" />
<link rel="stylesheet" href="styles/cursor.css?v=20261004-6" />
</head>
<body>

  <!-- 四个象限：1 重要且紧急 | 2 重要不紧急 | 3 不重要但紧急 | 4 不重要且不紧急 -->
  <div class="q q1"><span class="num">1</span>
    <span class="tag"><span class="chip c1">1</span><span><b>重要且紧急</b><i>立即执行</i></span></span></div>
  <div class="q q2"><span class="num">2</span>
    <span class="tag"><span class="chip c2">2</span><span><b>重要不紧急</b><i>制定计划</i></span></span></div>
  <div class="q q3"><span class="num">3</span>
    <span class="tag"><span class="chip c3">3</span><span><b>不重要但紧急</b><i>委托他人</i></span></span></div>
  <div class="q q4"><span class="num">4</span>
    <span class="tag"><span class="chip c4">4</span><span><b>不重要且不紧急</b><i>减少或删除</i></span></span></div>
  <div id="cross"></div>


  <div class="account">
    <span class="syncdot" id="syncDot"></span>
    <button id="accountBtn" type="button">本机模式</button>
  </div>

  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <button class="auth-close" id="authClose" type="button">×</button>
      <h2>账号与跨设备同步</h2>
      <p id="authHint">登录后，你的任务布局和插件数据会同步到其他设备。</p>
      <input id="authEmail" type="email" placeholder="邮箱" autocomplete="email" />
      <input id="authPassword" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" />
      <div class="auth-password-panel" id="passwordChangeBox" style="display:none">
        <div class="auth-section-title">密码安全</div>
        <input id="currentPassword" type="password" placeholder="当前密码" autocomplete="current-password" />
        <input id="newPassword" type="password" placeholder="新密码（至少 8 位）" autocomplete="new-password" />
        <input id="confirmPassword" type="password" placeholder="再次输入新密码" autocomplete="new-password" />
        <button class="auth-change" id="changePasswordBtn" type="button">保存新密码</button>
      </div>
      <div class="auth-actions" id="authActions">
        <button class="auth-login" id="loginBtn" type="button">登录</button>
        <button class="auth-register" id="registerBtn" type="button">注册</button>
      </div>
      <button class="auth-logout" id="logoutBtn" type="button" style="display:none">退出登录</button>
      <div class="auth-msg" id="authMsg"></div>
    </div>
  </div>

  <div id="stage"></div>
  <div class="pill" id="hint">拖动任务，重新安排你的注意力 · 登录后自动同步</div>
  <div class="pill" id="toast"></div>
  <div class="pill" id="legend">紧急 ←　→ 不紧急　 · 　重要 ↑　↓ 不重要</div>


  <!-- 添加方块按钮 -->
  <button class="fab" id="addBtn" title="添加一个新任务方块">＋</button>

  <!-- 添加弹窗 -->
  <div class="overlay" id="overlay">
    <div class="dlg">
      <h3>＋ 添加任务方块</h3>
      <input id="txt" type="text" maxlength="12" placeholder="输入任务名称，留空则自动命名" autocomplete="off" />
      <div class="swatches" id="swatches"></div>
      <div class="btns">
        <button type="button" class="btn cancel" id="cancelBtn">取消</button>
        <button type="button" class="btn ok" id="okBtn">添加</button>
      </div>
    </div>
  </div>

  <!-- 垃圾桶：把方块拖到这里删除 -->
  <div class="trash" id="trash">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18" />
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
      <line x1="10" y1="11" x2="10" y2="17" />
      <line x1="14" y1="11" x2="14" y2="17" />
    </svg>
    <b>垃圾桶</b>
  </div>

  <!-- 重置：双击确认，清空存档并恢复示例任务 -->
  <button class="rbtn" id="resetBtn" title="清空当前任务并恢复示例（点两下确认）">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10" />
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
    </svg>
    <span id="resetTxt">重置</span>
  </button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="plugin-runtime.js"></script>
<script src="plugin-store.js"></script>
<script src="ui-2.js?v=20261004-6"></script>
<script>
  const stage = document.getElementById("stage");
  const quads = document.querySelectorAll(".q");
  const NAMES = ["重要且紧急", "重要不紧急", "不重要但紧急", "不重要且不紧急"];
  let topZ = 1, cur = null;
  const trashEl = document.getElementById("trash");

  // 云同步状态提前初始化，保证本地启动阶段调用 saveState/ledSave 时不会触发 TDZ。
  let sb = null;
  let currentUser = null;
  let cloudTimer = null;
  let cloudApplying = false;

  // ---------- 示例任务与“添加方块”共用逻辑 ----------
  const PALETTE = ["#ef4444", "#f97316", "#ec4899", "#8b5cf6",
                   "#6366f1", "#14b8a6", "#22c55e", "#f59e0b"];

  // 新建一个方块（文字用 textContent 写入，名称含特殊字符也安全）
  function addBox(name, color, x, y, s) {
    const box = document.createElement("div");
    box.className = "box";
    // 传了合法大小就用它（恢复存档），否则随机 130~180
    const size = s && s >= 72 && s <= 250 ? s : Math.max(84, Math.min(160, 110 + Math.floor(Math.random() * 42)));
    box.style.width = box.style.height = size + "px";
    box.style.background = "linear-gradient(135deg, " + color + ", " + color + "88)";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = name;
    box.appendChild(label);
    let px, py;
    if (typeof x === "number" && typeof y === "number") {
      // 恢复保存的位置，并限制在当前视口内
      px = Math.max(0, Math.min(x, innerWidth - size));
      py = Math.max(70, Math.min(y, innerHeight - size - 40));
    } else {
      const pos = freePos(size);
      px = pos[0];
      py = pos[1];
    }
    box.style.left = px + "px";
    box.style.top = py + "px";
    stage.appendChild(box);
    return box;
  }

  // 在空白处找一个不与已有方块重叠的位置（最多试 24 次）
  function freePos(s) {
    const yTop = 70, yMax = innerHeight - s - 120;
    for (let t = 0; t < 24; t++) {
      const x = Math.random() * (innerWidth - s);
      const y = yTop + Math.random() * Math.max(10, yMax - yTop);
      let hit = false;
      for (let i = 0; i < stage.children.length; i++) {
        const b = stage.children[i];
        const bx = parseFloat(b.style.left) || 0;
        const by = parseFloat(b.style.top) || 0;
        const bw = b.offsetWidth, bh = b.offsetHeight;
        if (!(x + s + 10 <= bx || bx + bw + 10 <= x || y + s + 10 <= by || by + bh + 10 <= y)) {
          hit = true;
          break;
        }
      }
      if (!hit) return [x, y];
    }
    const x = Math.random() * (innerWidth - s);
    const y = yTop + Math.random() * Math.max(10, yMax - yTop);
    return [x, y];
  }

  // 初始示例任务（文字、颜色）
  const TASKS = [
    ["处理客户投诉", "#ef4444"],
    ["修复线上故障", "#dc2626"],
    ["项目紧急验收", "#f97316"],
    ["每日锻炼身体", "#22c55e"],
    ["阅读专业书籍", "#14b8a6"],
    ["学习新的技能", "#6366f1"],
    ["刷短视频消遣", "#a855f7"],
    ["整理手机相册", "#64748b"],
  ];
  // ---------- 自动保存 / 恢复（localStorage） ----------
  const SAVE_KEY = "matrixTasksV1";
  let saveWarned = false;

  // 收集所有方块：用归一化坐标保存，保证不同分辨率设备上的相对布局一致
  function collectState() {
    const minDim = Math.max(1, Math.min(innerWidth, innerHeight));
    return Array.prototype.slice.call(stage.querySelectorAll(".box")).map((b, i) => {
      const label = b.querySelector(".label");
      const m = (b.style.background || "").match(/#[0-9a-fA-F]{6}/);
      const z = parseInt(b.style.zIndex, 10);
      const s = b.offsetWidth;
      const x = parseFloat(b.style.left) || 0;
      const y = parseFloat(b.style.top) || 0;
      const maxX = Math.max(1, innerWidth - s);
      const maxY = Math.max(1, innerHeight - s);
      return {
        t: label ? label.textContent : "",
        c: m ? m[0] : "#6366f1",
        nx: Math.max(0, Math.min(1, x / maxX)),
        ny: Math.max(0, Math.min(1, y / maxY)),
        sr: s / minDim,
        z: isNaN(z) ? i : z,
      };
    });
  }

  function restoreTaskArray(arr) {
    if (!Array.isArray(arr)) return null;
    stage.innerHTML = "";
    topZ = 1;
    const minDim = Math.max(1, Math.min(innerWidth, innerHeight));
    arr.forEach((it) => {
      const size = Number.isFinite(Number(it.sr))
        ? Math.max(72, Math.min(180, Number(it.sr) * minDim))
        : Number(it.s);
      const safeSize = Number.isFinite(size) ? size : 110;
      const x = Number.isFinite(Number(it.nx))
        ? Number(it.nx) * Math.max(1, innerWidth - safeSize)
        : Number(it.x);
      const y = Number.isFinite(Number(it.ny))
        ? Number(it.ny) * Math.max(1, innerHeight - safeSize)
        : Number(it.y);
      const b = addBox(
        it.t || "",
        /^#[0-9a-fA-F]{6}$/.test(it.c) ? it.c : "#6366f1",
        Number.isFinite(x) ? x : undefined,
        Number.isFinite(y) ? y : undefined,
        safeSize
      );
      const z = parseInt(it.z, 10);
      if (!isNaN(z)) {
        b.style.zIndex = z;
        if (z >= topZ) topZ = z + 1;
      }
    });
    return arr.length;
  }

  function saveState() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(collectState()));
    } catch (err) {
      console.warn("自动保存失败：", err);
      if (!saveWarned) {
        saveWarned = true;
        showToast("当前浏览器不允许本地保存");
      }
    }
    scheduleCloudSave();
  }

  // 返回恢复的数量；没有存档或存档损坏返回 null
  function restoreState() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw === null) return null;
      return restoreTaskArray(JSON.parse(raw));
    } catch (err) {
      console.warn("恢复失败：", err);
      return null;
    }
  }


  // ---------- 添加按钮与弹窗 ----------
  const overlay = document.getElementById("overlay");
  const txt = document.getElementById("txt");
  const swRow = document.getElementById("swatches");
  const okBtn = document.getElementById("okBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  let selColor = PALETTE[0];

  // 生成颜色选择器
  PALETTE.forEach((c) => {
    const sw = document.createElement("button");
    sw.type = "button";
    sw.className = "sw";
    sw.style.background = "linear-gradient(135deg, " + c + ", " + c + "cc)";
    sw.title = "选择颜色";
    sw.addEventListener("click", () => {
      swRow.querySelectorAll(".sw").forEach((x) => x.classList.remove("sel"));
      sw.classList.add("sel");
      selColor = c;
    });
    swRow.appendChild(sw);
  });
  if (swRow.firstChild) swRow.firstChild.classList.add("sel");

  const nextTaskNo = () => stage.querySelectorAll(".box").length + 1;

  function openDlg() {
    txt.value = "任务 " + nextTaskNo();
    overlay.classList.add("open");
    txt.focus();
    txt.select();
  }
  function closeDlg() {
    overlay.classList.remove("open");
  }
  function confirmAdd() {
    const name = txt.value.trim() || ("任务 " + nextTaskNo());
    addBox(name, selColor);
    saveState();
    showToast("已添加：「" + name + "」");
    closeDlg();
  }

  document.getElementById("addBtn").addEventListener("click", openDlg);
  okBtn.addEventListener("click", confirmAdd);
  cancelBtn.addEventListener("click", closeDlg);
  overlay.addEventListener("pointerdown", (e) => {
    if (e.target === overlay) closeDlg();
  });
  txt.addEventListener("keydown", (e) => {
    if (e.key === "Enter") confirmAdd();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDlg();
  });
  // 根据方块中心位置判断所在象限（0=左上 … 3=右下）
  function quadIndex(cx, cy) {
    return (cx >= innerWidth / 2 ? 1 : 0) + (cy >= innerHeight / 2 ? 2 : 0);
  }
  function markQuad(i) {
    if (i === cur) return;
    if (cur !== null) quads[cur].classList.remove("active");
    cur = i;
    if (i !== null) quads[i].classList.add("active");
  }

  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1100);
  }

  stage.addEventListener("pointerdown", (e) => {
    const box = e.target.closest(".box");
    if (!box) return;

    box.setPointerCapture(e.pointerId);

    const r = box.getBoundingClientRect();
    const bw = r.width;
    const bh = r.height;
    const viewportW = innerWidth;
    const viewportH = innerHeight;
    const startX = r.left;
    const startY = r.top;
    const ox = e.clientX - r.left;
    const oy = e.clientY - r.top;

    let x = startX;
    let y = startY;
    let nextX = x;
    let nextY = y;
    let raf = 0;
    let drop = false;

    box.style.zIndex = ++topZ;
    markQuad(quadIndex(startX + bw / 2, startY + bh / 2));

    // 缓存垃圾桶位置，拖动期间不重复读取布局
    const tr = trashEl.getBoundingClientRect();
    const overTrash = (px, py) =>
      px + bw >= tr.left && px <= tr.right &&
      py + bh >= tr.top && py <= tr.bottom;

    const paintMove = () => {
      raf = 0;
      x = nextX;
      y = nextY;

      // translate 通常可由合成线程处理，避免每帧改 left/top 触发布局
      box.style.translate = (x - startX) + "px " + (y - startY) + "px";

      drop = overTrash(x, y);
      trashEl.classList.toggle("hot", drop);

      if (drop) {
        markQuad(null);
      } else {
        markQuad(quadIndex(x + bw / 2, y + bh / 2));
      }
    };

    const onMove = (ev) => {
      nextX = Math.max(0, Math.min(ev.clientX - ox, viewportW - bw));
      nextY = Math.max(0, Math.min(ev.clientY - oy, viewportH - bh));

      // 一帧最多执行一次 DOM 写入，避免高频 pointermove 淹没渲染线程
      if (!raf) raf = requestAnimationFrame(paintMove);
    };

    const onUp = () => {
      if (raf) {
        cancelAnimationFrame(raf);
        paintMove();
      }

      trashEl.classList.remove("hot");

      // 只在拖动结束时把最终位置提交到 left/top，保证存档格式不变
      box.style.translate = "";
      box.style.left = x + "px";
      box.style.top = y + "px";

      if (drop) {
        // 扔进垃圾桶：缩小旋转消失后移除
        const lab = box.querySelector(".label");
        const nm = lab ? lab.textContent : "";
        markQuad(null);
        box.animate(
          [
            { transform: "scale(1) rotate(0deg)", opacity: 1 },
            { transform: "scale(.15) rotate(30deg)", opacity: 0 },
          ],
          { duration: 280, easing: "ease-in" }
        ).onfinish = () => { box.remove(); saveState(); };
        showToast("已删除：「" + nm + "」");
      } else {
        const i = quadIndex(x + bw / 2, y + bh / 2);
        showToast("已放入：「" + NAMES[i] + "」");
        markQuad(null);
        saveState();
      }

      box.removeEventListener("pointermove", onMove);
      box.removeEventListener("pointerup", onUp);
      box.removeEventListener("pointercancel", onUp);
    };

    box.addEventListener("pointermove", onMove);
    box.addEventListener("pointerup", onUp);
    box.addEventListener("pointercancel", onUp);
  });
  // 启动：有存档就恢复；没有则生成示例任务并首次保存
  const savedCount = restoreState();
  if (savedCount === null) {
    TASKS.forEach((t) => addBox(t[0], t[1]));
    saveState();
  } else if (savedCount > 0) {
    showToast("已恢复上次的 " + savedCount + " 个任务");
  }
  // ---------- 重置：清空存档并恢复示例任务（点两下确认） ----------
  const resetBtn = document.getElementById("resetBtn");
  const resetTxt = document.getElementById("resetTxt");
  let resetArmTimer = null;

  function disarmReset() {
    resetBtn.classList.remove("armed");
    resetTxt.textContent = "重置";
    clearTimeout(resetArmTimer);
  }

  resetBtn.addEventListener("click", () => {
    if (!resetBtn.classList.contains("armed")) {
      resetBtn.classList.add("armed");
      resetTxt.textContent = "再点一次确认？";
      clearTimeout(resetArmTimer);
      resetArmTimer = setTimeout(disarmReset, 3000);
      return;
    }
    disarmReset();
    try { localStorage.removeItem(SAVE_KEY); } catch (err) { /* 忽略 */ }
    stage.innerHTML = "";
    topZ = 1;
    TASKS.forEach((t) => addBox(t[0], t[1]));
    saveState();
    showToast("已重置为示例任务");
  });

  // 点击页面其他地方时取消“待确认”状态
  document.addEventListener("pointerdown", (e) => {
    if (!resetBtn.contains(e.target)) disarmReset();
  }, true);
  // ================= 账号 / Supabase 跨设备同步 =================
  const cfg = window.TASKS_MATRIX_CONFIG || {};
  let lastViewportW = innerWidth;
  let lastViewportH = innerHeight;

  const accountBtn = document.getElementById("accountBtn");
  const syncDot = document.getElementById("syncDot");
  const authOverlay = document.getElementById("authOverlay");
  const authClose = document.getElementById("authClose");
  const authEmail = document.getElementById("authEmail");
  const authPassword = document.getElementById("authPassword");
  const passwordChangeBox = document.getElementById("passwordChangeBox");
  const currentPassword = document.getElementById("currentPassword");
  const newPassword = document.getElementById("newPassword");
  const confirmPassword = document.getElementById("confirmPassword");
  const changePasswordBtn = document.getElementById("changePasswordBtn");
  const authMsg = document.getElementById("authMsg");
  const loginBtn = document.getElementById("loginBtn");
  const registerBtn = document.getElementById("registerBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const authActions = document.getElementById("authActions");
  const authHint = document.getElementById("authHint");

  function isCloudConfigured() {
    return Boolean(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY &&
      window.supabase && typeof window.supabase.createClient === "function");
  }

  function setSyncState(state) {
    syncDot.classList.remove("online", "busy");
    if (state === "online") syncDot.classList.add("online");
    if (state === "busy") syncDot.classList.add("busy");
  }

  function refreshAuthUI() {
    if (currentUser) {
      accountBtn.textContent = currentUser.email || "已登录";
      accountBtn.classList.add("auth-user");
      authActions.style.display = "none";
      logoutBtn.style.display = "block";
      passwordChangeBox.style.display = "block";
      authEmail.style.display = "none";
      authPassword.style.display = "none";
      authHint.textContent = "已登录。当前布局会自动同步到你的其他设备。";
      setSyncState("online");
    } else {
      accountBtn.classList.remove("auth-user");
      accountBtn.textContent = isCloudConfigured() ? "登录 / 注册" : "本机模式";
      authActions.style.display = "grid";
      logoutBtn.style.display = "none";
      passwordChangeBox.style.display = "none";
      authEmail.style.display = "";
      authPassword.style.display = "";
      authHint.textContent = isCloudConfigured()
        ? "登录后，你的任务布局和插件数据会同步到其他设备。"
        : "Supabase 尚未配置。当前仍可使用本机存储。";
      setSyncState("");
    }
  }

  function openAuth() {
    authMsg.textContent = "";
    authOverlay.classList.add("open");
    if (!currentUser) setTimeout(() => authEmail.focus(), 0);
  }
  function closeAuth() { authOverlay.classList.remove("open"); }

  accountBtn.addEventListener("click", openAuth);
  authClose.addEventListener("click", closeAuth);
  authOverlay.addEventListener("pointerdown", (e) => { if (e.target === authOverlay) closeAuth(); });

  async function cloudSaveNow() {
    if (!sb || !currentUser || cloudApplying) return;
    setSyncState("busy");
    const payload = {
      version: 4,
      tasks: collectState(),
      plugins: window.TaskMatrixPlugins?.getSnapshot?.() || null
    };
    const { error } = await sb.from("app_state").upsert({
      user_id: currentUser.id,
      state: payload,
      updated_at: new Date().toISOString()
    }, { onConflict: "user_id" });
    if (error) {
      console.warn("云端保存失败：", error);
      setSyncState("");
    } else {
      setSyncState("online");
    }
  }

  function scheduleCloudSave() {
    if (!sb || !currentUser || cloudApplying) return;
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(cloudSaveNow, 450);
  }

  async function loadCloudState() {
    if (!sb || !currentUser) return;
    setSyncState("busy");
    const { data, error } = await sb.from("app_state")
      .select("state")
      .eq("user_id", currentUser.id)
      .maybeSingle();

    if (error) {
      console.warn("云端读取失败：", error);
      authMsg.textContent = "云端读取失败：" + error.message;
      setSyncState("");
      return;
    }

    if (data && data.state) {
      cloudApplying = true;
      const st = data.state || {};
      if (Array.isArray(st.tasks)) {
        restoreTaskArray(st.tasks);
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(st.tasks)); } catch (e) {}
      }
      if (window.TaskMatrixPlugins?.restoreSnapshot) {
        const pluginSnapshot = st.plugins && typeof st.plugins === "object"
          ? {
              version: 1,
              installed: Array.isArray(st.plugins.installed) ? st.plugins.installed : [],
              state: st.plugins.state && typeof st.plugins.state === "object"
                ? { ...st.plugins.state }
                : {}
            }
          : { version: 1, installed: [], state: {} };

        if (Array.isArray(st.ledger) && !pluginSnapshot.state.ledger) {
          pluginSnapshot.state.ledger = {
            records: st.ledger,
            open: false
          };
        }
        await window.TaskMatrixPlugins.restoreSnapshot(pluginSnapshot, { silent: true });
      }
      cloudApplying = false;
      showToast("已从云端同步");
      setSyncState("online");
    } else {
      // 首次登录：把当前本机数据迁移到云端
      await cloudSaveNow();
      showToast("已创建云端存档");
    }
  }

  async function initCloud() {
    if (!isCloudConfigured()) {
      refreshAuthUI();
      return;
    }
    try {
      sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      const { data } = await sb.auth.getSession();
      currentUser = data.session ? data.session.user : null;
      refreshAuthUI();
      if (currentUser) await loadCloudState();

      sb.auth.onAuthStateChange((_event, session) => {
        const nextUser = session ? session.user : null;
        const changed = (currentUser && nextUser && currentUser.id !== nextUser.id) ||
                        (!!currentUser !== !!nextUser);
        currentUser = nextUser;
        refreshAuthUI();
        if (changed && currentUser) setTimeout(loadCloudState, 0);
      });
    } catch (err) {
      console.warn("Supabase 初始化失败：", err);
      authMsg.textContent = "同步服务初始化失败，将继续使用本机模式。";
      sb = null;
      currentUser = null;
      refreshAuthUI();
    }
  }

  loginBtn.addEventListener("click", async () => {
    if (!sb) { authMsg.textContent = "请先在 config.js 中配置 Supabase。"; return; }
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || !password) { authMsg.textContent = "请输入邮箱和密码。"; return; }
    authMsg.textContent = "正在登录…";
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { authMsg.textContent = error.message; return; }
    currentUser = data.user;
    refreshAuthUI();
    await loadCloudState();
    authMsg.textContent = "";
    closeAuth();
  });

  registerBtn.addEventListener("click", async () => {
    if (!sb) { authMsg.textContent = "请先在 config.js 中配置 Supabase。"; return; }
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || password.length < 6) {
      authMsg.textContent = "请输入有效邮箱，密码至少 6 位。";
      return;
    }
    authMsg.textContent = "正在注册…";
    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: location.origin + location.pathname }
    });
    if (error) { authMsg.textContent = error.message; return; }
    if (data.session) {
      currentUser = data.user;
      refreshAuthUI();
      await cloudSaveNow();
      closeAuth();
    } else {
      authMsg.textContent = "注册成功。请检查邮箱完成验证，然后回来登录。";
    }
  });

  changePasswordBtn.addEventListener("click", async () => {
    if (!sb || !currentUser) return;
    const oldPw = currentPassword.value;
    const nextPw = newPassword.value;
    const confirmPw = confirmPassword.value;
    if (!oldPw || nextPw.length < 8) {
      authMsg.textContent = "请输入当前密码，新密码至少 8 位。";
      return;
    }
    if (nextPw !== confirmPw) {
      authMsg.textContent = "两次输入的新密码不一致。";
      return;
    }
    if (oldPw === nextPw) {
      authMsg.textContent = "新密码不能与当前密码相同。";
      return;
    }
    authMsg.textContent = "正在验证当前密码…";
    const email = currentUser.email;
    if (!email) {
      authMsg.textContent = "当前账号没有邮箱，无法使用密码修改功能。";
      return;
    }
    const { error: verifyError } = await sb.auth.signInWithPassword({ email, password: oldPw });
    if (verifyError) {
      authMsg.textContent = "当前密码不正确。";
      return;
    }
    authMsg.textContent = "正在修改密码…";
    const { error } = await sb.auth.updateUser({ password: nextPw });
    if (error) {
      authMsg.textContent = "修改失败：" + error.message;
      return;
    }
    currentPassword.value = "";
    newPassword.value = "";
    confirmPassword.value = "";
    authMsg.textContent = "密码修改成功。";
    showToast("密码修改成功");
  });

  logoutBtn.addEventListener("click", async () => {
    if (sb) await sb.auth.signOut();
    currentUser = null;
    refreshAuthUI();
    authMsg.textContent = "已退出登录。本机数据仍保留。";
  });

  // 视口尺寸改变时，按归一化坐标重新映射任务位置
  let resizeTimer = null;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const arr = collectState();
      // collectState 基于当前像素，先按旧视口重新归一化以避免尺寸跳变造成越界
      const oldW = lastViewportW, oldH = lastViewportH;
      Array.from(stage.querySelectorAll(".box")).forEach((b, i) => {
        const s = b.offsetWidth;
        const oldMaxX = Math.max(1, oldW - s);
        const oldMaxY = Math.max(1, oldH - s);
        const x = parseFloat(b.style.left) || 0;
        const y = parseFloat(b.style.top) || 0;
        if (arr[i]) {
          arr[i].nx = Math.max(0, Math.min(1, x / oldMaxX));
          arr[i].ny = Math.max(0, Math.min(1, y / oldMaxY));
        }
      });
      lastViewportW = innerWidth;
      lastViewportH = innerHeight;
      restoreTaskArray(arr);
      saveState();
    }, 160);
  });

  async function initPlugins() {
    if (!window.TaskMatrixPlugins) return;
    try {
      window.TaskMatrixPluginUI?.init?.({ toast: showToast });
      await window.TaskMatrixPlugins.boot({
        toast: showToast,
        requestSave: scheduleCloudSave,
        getUser: () => currentUser,
        getTasks: collectState,
        addLauncher: (id, item) => window.TaskMatrixPluginUI?.addLauncher?.(id, item),
        removeLauncher: (id) => window.TaskMatrixPluginUI?.removeLauncher?.(id)
      });
      window.TaskMatrixPluginUI?.refresh?.();
    } catch (err) {
      console.warn("插件系统初始化失败：", err);
      showToast("插件系统初始化失败");
    }
  }

  refreshAuthUI();
  (async () => {
    await initPlugins();
    await initCloud();
  })();

</script>
</body>
</html>
